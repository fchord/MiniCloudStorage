# Recreates the existing default/nginx-test pod with an extra ConfigMap vhost.
# Does not change default.conf. Cloudflare continues to hit nginx-nodeport:30987.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minicloudstorage-nginx
  namespace: default
  labels:
    app.kubernetes.io/part-of: minicloudstorage
data:
  minicloudstorage.conf: |
    server {
        listen 80;
        listen [::]:80;
        server_name minicloudstorage.19121122.xyz;

        access_log /var/log/nginx/minicloudstorage.access.log;
        error_log  /var/log/nginx/minicloudstorage.error.log;

        client_max_body_size 12m;
        client_body_timeout 300s;

        location / {
            proxy_pass http://api.minicloudstorage.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-test
  namespace: default
  labels:
    run: nginx-test
spec:
  containers:
    - name: nginx-test
      image: nginx
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: minicloudstorage-vhost
          mountPath: /etc/nginx/conf.d/minicloudstorage.conf
          subPath: minicloudstorage.conf
          readOnly: true
  volumes:
    - name: minicloudstorage-vhost
      configMap:
        name: minicloudstorage-nginx
