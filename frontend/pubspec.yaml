name: minicloudstorage
description: Temporary file sharing for MiniCloudStorage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  http: ^1.2.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Noto Sans SC Regular subset (~6MB): Latin + CJK punctuation/fullwidth +
  # U+4E00-9FFF. Not the 30MB+ full Noto CJK. MaterialIcons stays separate.
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
